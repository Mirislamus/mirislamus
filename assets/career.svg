<svg xmlns="http://www.w3.org/2000/svg" width="840" height="240" viewBox="0 0 840 240" fill="none" role="img" aria-label="Career: Web Pult 2018, One Web 2019, Margin Digital Studio 2020, Humandone 2022, Dafna 2024 — now">
<title>Career: Web Pult 2018, One Web 2019, Margin Digital Studio 2020, Humandone 2022, Dafna 2024 — now</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.pop{transform-box:fill-box;transform-origin:center}

@keyframes draw{from{stroke-dashoffset:660}}
.draw{animation:draw 2.4s linear 0.3s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.node{animation:pop .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.22,1,.36,1) both}
@keyframes ping{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
.ping{animation:ping 1.8s cubic-bezier(0,0,.2,1) 3s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
