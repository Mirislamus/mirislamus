<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" fill="none" role="img" aria-label="Top secret: two projects under NDA currently in development">
<title>Top secret: two projects under NDA currently in development</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.pop{transform-box:fill-box;transform-origin:center}

@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
.stamp{animation:flicker 4s infinite}
@keyframes scan{from{transform:translateX(-60px)}to{transform:translateX(330px)}}
.scan{animation:scan 2.6s linear infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(3);opacity:0}}
.ping{animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s step-end infinite}
@keyframes ring0{from{stroke-dashoffset:163.36}}.ring0{animation:ring0 2.2s cubic-bezier(.22,1,.36,1) 0.4s both}
@keyframes ring1{from{stroke-dashoffset:163.36}}.ring1{animation:ring1 2.2s cubic-bezier(.22,1,.36,1) 0.7s both}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
