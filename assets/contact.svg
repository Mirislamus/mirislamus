<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" fill="none" role="img" aria-label="Have a project? Let’s discuss it.">
<title>Have a project? Let’s discuss it.</title>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.pop{transform-box:fill-box;transform-origin:center}

@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
.glow{animation:breathe 5s ease-in-out infinite;transform-origin:420px 85px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .8s cubic-bezier(.22,1,.36,1) both}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<clipPath id="cc"><rect x="0.5" y="0.5" width="839" height="169" rx="24"/></clipPath>
<radialGradient id="cg"><stop offset="0" stop-color="#44FF62" stop-opacity=".22"/><stop offset="1" stop-color="#44FF62" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="839" height="169" rx="24" fill="#121212" stroke="rgba(68,255,98,.28)"/>
<g clip-path="url(#cc)"><ellipse class="glow" cx="420" cy="170" rx="380" ry="150" fill="url(#cg)"/></g>
<text class="rise" x="420" y="80" text-anchor="middle" font-size="36" font-weight="800" letter-spacing="-.8" fill="#F5F5F5">Have a project? <tspan fill="#44FF62">Let’s discuss it.</tspan></text>
<text class="rise" style="animation-delay:.15s" x="420" y="116" text-anchor="middle" font-size="15" fill="#A3A3A3">Landing pages, stores, services, Web3 and Telegram Mini Apps</text>
</svg>
